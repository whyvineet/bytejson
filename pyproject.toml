[project]
name = "bytejson"
version = "0.1.0"
description = "Random access to very large JSON files without loading the entire document into Python memory"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Vineet Kumar" },
]
keywords = [
    "json",
    "mmap",
    "random-access",
    "lazy-loading",
    "large-files",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: File Formats",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/whyvineet/bytejson"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bytejson"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]