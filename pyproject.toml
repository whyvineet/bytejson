[project]
name = "bytejson"
version = "0.1.0"
description = "Random access to very large JSON files without loading them into memory"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Vineet Kumar" }]

[project.urls]
Repository = "https://github.com/whyvineet/bytejson"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bytejson"]

[dependency-groups]
dev = ["pytest>=8.0"]